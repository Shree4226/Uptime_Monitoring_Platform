services:
  # -------------------------------------------------------------
  # Combined Backend: FastAPI + Celery Worker + Celery Beat
  # -------------------------------------------------------------
  - type: web
    name: uptime-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: ./entrypoint.sh
    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uptime-postgres
          property: connectionString

      - key: REDIS_BROKER_URL
        fromService:
          type: keyvalue
          name: uptime-redis
          property: connectionString

      - key: REDIS_BACKEND_URL
        fromService:
          type: keyvalue
          name: uptime-redis
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: FRONTEND_URL
        fromService:
          type: web
          name: uptime-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # -------------------------------------------------------------
  # Frontend: React + Vite Static Site
  # -------------------------------------------------------------
  - type: web
    name: uptime-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: uptime-backend
          envVarKey: RENDER_EXTERNAL_URL

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # -------------------------------------------------------------
  # Redis / Key Value
  # -------------------------------------------------------------
  - type: keyvalue
    name: uptime-redis
    plan: free
    region: singapore
    ipAllowList: []

# -------------------------------------------------------------
# PostgreSQL
# -------------------------------------------------------------
databases:
  - name: uptime-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: uptime_db
    user: uptime_user