name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    env:
      DATABASE_URL: postgresql+psycopg://uptime_user:uptime_password@localhost:5432/uptime_test_db
      REDIS_BROKER_URL: redis://localhost:6379/0
      REDIS_BACKEND_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uptime_user
          POSTGRES_PASSWORD: uptime_password
          POSTGRES_DB: uptime_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptime_user -d uptime_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      
      - name: Run tests
        working-directory: backend
        run: pytest tests